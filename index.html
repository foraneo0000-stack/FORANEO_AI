<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORANEO_AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
body{margin:0;font-family:system-ui,Arial;background:#f5f7ff;color:#222}
.header{background:#1a5cff;color:#fff;text-align:center;padding:16px 12px;position:relative}
.header h1{margin:0;font-size:28px;font-weight:900}
.header p{margin:6px 0 0;font-size:13px;opacity:0.95;line-height:1.3}
.live{position:absolute;right:12px;top:12px;background:#fff;color:#1a5cff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:8px;padding:10px;background:#fff;border-bottom:1px solid #e8ecff;overflow-x:auto}
.tab{white-space:nowrap;padding:8px 16px;border-radius:22px;border:1px solid #dbe2ff;background:#fff;color:#1a5cff;font-size:14px;cursor:pointer}
.tab.active{background:#1a5cff;color:#fff}
#chat{padding:12px;padding-bottom:190px;display:flex;flex-direction:column;gap:10px;min-height:55vh}
.bubble{max-width:88%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:#1a5cff;color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#fff;border:1px solid #e5eaff;border-bottom-left-radius:4px}
.ai img{max-width:100%;border-radius:10px;margin-top:8px;display:block}
video{width:100%;border-radius:12px;background:#000;margin-top:8px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;border-top:1px solid #e8ecff}
.upload{padding:9px 12px;border:1px solid #dbe2ff;border-radius:20px;margin-bottom:8px;font-size:13px;color:#1a5cff;background:#f8f9ff;cursor:pointer}
.pills{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pill{border:1px solid #dbe2ff;background:#f8f9ff;color:#1a5cff;padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer}
.row{display:flex;gap:8px}
.row input{flex:1;padding:12px 16px;border-radius:25px;border:1px solid #dbe2ff;outline:none;font-size:14px}
.row button{background:#1a5cff;color:#fff;border:none;padding:12px 22px;border-radius:25px;font-weight:700;cursor:pointer}
#callBox{display:none;position:fixed;top:65px;left:10px;right:10px;background:#111;border-radius:14px;padding:8px;z-index:99}
</style>
</head>
<body>
<div class="header">
<div class="live" onclick="videoCall()">LIVE CAM</div>
<h1>FORANEO_AI</h1>
<p>FORANEO (PTY) LTD • Foraneo Net Department<br>KARABO • All Things ON</p>
</div>
<div class="tabs">
<div class="tab active">💬 Chat</div>
<div class="tab" onclick="document.getElementById('input').value='Generate a lion photo ';document.getElementById('input').focus()">🎨 Image / Logo</div>
<div class="tab" onclick="calc()">🧮 Calculator</div>
<div class="tab" onclick="games()">🎮 Games</div>
</div>
<div id="chat"></div>
<div id="callBox"><video id="cam" autoplay playsinline></video><div style="display:flex;gap:8px;margin-top:6px"><button onclick="endCall()" style="flex:1;padding:10px;background:red;color:#fff;border:none;border-radius:20px">End</button><button onclick="speak()" style="flex:1;padding:10px;background:#1a5cff;color:#fff;border:none;border-radius:20px">Speak</button></div></div>
<div class="bar">
<div class="upload" onclick="document.getElementById('file').click()">🏀 📎 Upload Image / Document / File / MP3 / MP4</div>
<input type="file" id="file" hidden accept="image/*,.pdf,.doc,.docx,.mp3,.mp4">
<div class="pills">
<div class="pill" onclick="voiceNote()">▶️ Voice Note</div>
<div class="pill" onclick="voiceCall()">🎤 Voice Call</div>
<div class="pill" onclick="videoCall()">👤 Video Call - LIVE CAM</div>
</div>
<div class="row">
<input id="input" placeholder="Ask FORANEO_AI..." />
<button id="sendBtn">Send</button>
</div>
</div>
<script>
let lastImg=null,lastName='',lastAns='',stream=null;
const chatEl=document.getElementById('chat'),inputEl=document.getElementById('input'),fileEl=document.getElementById('file');
function addBubble(role,text,img){
let d=document.createElement('div');d.className='bubble '+(role==='user'?'user':'ai');
d.innerHTML=(role==='user'?'👤 <b>You:</b> ':'🤖 <b>FORANEO_AI:</b> ')+text.replace(/</g,'&lt;').replace(/\n/g,'<br>');
if(img){let im=document.createElement('img');im.src=img;d.appendChild(im);}
chatEl.appendChild(d);window.scrollTo(0,document.body.scrollHeight);if(role==='ai')lastAns=text;
}
addBubble('ai','I am FORANEO AI - I am created by FORANEO (PTY) LTD to help with everything.');
function calc(){let q=prompt('Enter calculation:');if(q)try{addBubble('ai','Calculator: '+q+' = '+(Function('return '+q)()))}catch(e){addBubble('ai','Error: '+e.message)}}
function games(){addBubble('ai','Games: Type "guess number 1-100" or "quiz me"');}
function speak(){speechSynthesis.speak(new SpeechSynthesisUtterance(lastAns.slice(0,500)));}
function endCall(){if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById('callBox').style.display='none';}
async function voiceCall(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});document.getElementById('callBox').style.display='block';document.getElementById('cam').style.display='none';addBubble('ai','Voice Call CONNECTED');let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let r=new SR();r.continuous=true;r.lang='en-US';r.start();r.onresult=e=>{let t=e.results[e.results.length-1][0].transcript;inputEl.value=t;send(true);}}}catch(e){addBubble('ai','Mic needed: '+e.message);}}
async function videoCall(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('cam').srcObject=stream;document.getElementById('cam').style.display='block';document.getElementById('callBox').style.display='block';addBubble('ai','LIVE CAM CONNECTED');}catch(e){addBubble('ai','Camera needed: '+e.message);}}
function voiceNote(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addBubble('ai','Voice not supported');return;}let r=new SR();r.lang='en-US';r.start();addBubble('ai','Listening...');r.onresult=e=>{inputEl.value=e.results[0][0].transcript;send();};}
fileEl.addEventListener('change',()=>{
let f=fileEl.files[0];if(!f)return;
let rd=new FileReader();
rd.onload=e=>{lastImg=e.target.result;lastName=f.name;addBubble('user','Uploaded: '+f.name+' ('+Math.round(f.size/1024)+' KB)',lastImg);addBubble('ai','Got file '+f.name+' - I can SEE it now. Type "Explain it" or "Read it"');};
rd.readAsDataURL(f);
});
async function send(isVoice=false){
let txt=inputEl.value.trim();if(!txt)return;inputEl.value='';addBubble('user',txt);
let typing=document.createElement('div');typing.className='bubble ai';typing.textContent='🤖 FORANEO_AI: Typing...';chatEl.appendChild(typing);
const SYS="You are FORANEO_AI. Identity: I am FORANEO AI - I am created by FORANEO (PTY) LTD to help with everything. Never brackets. Use real names Dr Smith, Business Assignment 1, 10 Nov 2026, Karabo. Help with everything.";
try{
let l=txt.toLowerCase();
if((l.includes('generate')||l.includes('create')||l.includes('draw')||l.includes('make')) && (l.includes('image')||l.includes('photo')||l.includes('picture')||l.includes('logo')||l.includes('lion')) || l.includes('lion photo')){
let prompt=txt.replace(/generate|create|draw|make/gi,'').replace(/image|photo|logo/gi,'').trim()||txt;
typing.textContent='Generating: '+prompt;
let img=await puter.ai.txt2img(prompt);
typing.remove();addBubble('ai','Generated: "'+prompt+'" by FORANEO AI',img.src);if(isVoice)speak();return;
}
let msgs=[{role:'system',content:SYS}];
if(lastImg){msgs.push({role:'user',content:[{type:'text',text:txt+' - user uploaded '+lastName+' - read and explain image content, OCR text, summarize like Meta AI can see images.'},{type:'image_url',image_url:{url:lastImg}}]});}
else{msgs.push({role:'user',content:txt});}
let res=await puter.ai.chat(msgs,{model:'gpt-4o'});
let out=res.message.content.replace(/\[.*?\]/g,'').trim();
typing.remove();addBubble('ai',out);if(isVoice)speak();
}catch(e){typing.remove();addBubble('ai','Error: '+e.message);}
}
document.getElementById('sendBtn').addEventListener('click',()=>send());
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
