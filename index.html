<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORANEO_AI - foraneo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#eef2ff;min-height:100vh;display:flex;flex-direction:column}
.top{background:#fff;padding:14px;text-align:center;border-bottom:1px solid #ddd}
.logo{width:150px;max-width:70%;border:3px solid #2b7cff;border-radius:14px}
.authbox{margin:12px auto;max-width:500px;background:#f0f5ff;padding:12px;border-radius:12px}
.authbox button,.authbox input{width:100%;padding:11px;margin:4px 0;border-radius:8px;border:1px solid #ccc;font-weight:bold}
.gbtn{background:#fff;color:#000 !important}
.ebtn{background:#2b7cff;color:#fff;border:0}
.keybox{margin:12px auto;max-width:500px;background:#fff;padding:10px;border-radius:12px;display:flex;gap:8px}
.keybox input{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px}
.keybox button{background:#2b7cff;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:700px;width:100%;margin:0 auto}
.msg{background:#fff;padding:12px 14px;border-radius:14px;max-width:85%;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:#2b7cff;color:#fff}
.ai{align-self:flex-start}
.tools{max-width:700px;width:100%;margin:0 auto;padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:8px}
.tools button,.tools label{background:#fff;border:1px solid #dbe4ff;padding:8px 14px;border-radius:20px;font-weight:bold;color:#2b7cff;cursor:pointer}
.bottom{max-width:700px;width:100%;margin:0 auto;padding:0 14px 16px;display:flex;gap:8px;align-items:center}
.bottom input{flex:1;padding:13px;border:1px solid #ccc;border-radius:25px;outline:none}
.bottom button{width:48px;height:48px;border-radius:50%;border:0;background:#2b7cff;color:#fff;font-size:20px}
.small{text-align:center;font-size:12px;color:#888;padding-bottom:8px}
</style>
</head>
<body>

<div class="top">
<img class="logo" src="https://via.placeholder.com/300x150?text=foraneo+(Pty)+Ltd" alt="foraneo">
<div style="font-weight:bold;color:#2b7cff;margin-top:6px">FORANEO_AI • FOREGO</div>
<div style="font-size:12px;color:#666">Created by FORANEO (PTY) LTD • FORANEO NET (MODERN LIFE, AIs)</div>
<div class="authbox">
<div id="userInfo" style="display:none;font-weight:bold;color:#2b7cff"></div>
<div id="loginBtns">
<button class="gbtn" onclick="loginGoogle()">🔵 Continue with Google</button>
<input id="emailInput" type="email" placeholder="Enter your email - e.g. you@gmail.com">
<input id="nameInput" type="text" placeholder="Enter your name">
<button class="ebtn" onclick="loginEmail()">📧 Login with Email</button>
</div>
<button id="logoutBtn" style="display:none;background:#ff4444;color:#fff;border:0" onclick="logout()">Logout</button>
</div>
<div class="keybox">
<input id="apiKey" type="password" placeholder="Paste your Gemini API Key here">
<button onclick="saveKey()">Save Key</button>
</div>
<div style="font-size:12px;color:#666;max-width:500px;margin:0 auto">Each person uses their OWN key. Your key stays in YOUR phone only. Get free key at aistudio.google.com/apikey</div>
</div>

<div id="chat"></div>

<div class="tools">
<label>🏀 📎 Upload Image / Document / File / MP3 / MP4 / PDF / DOC <input type="file" id="fileInput" hidden onchange="handleFile(this)"></label>
<button type="button" onclick="showVoiceNote()">▶️ Voice Note</button>
<button type="button" onclick="showVoiceCall()">🎤 Voice Call</button>
<button type="button" onclick="showVideoCall()">👤 Video Call</button>
<button type="button" id="helpBtn" onclick="showHelp()">📚 What FORANEO_AI can do</button>
</div>

<div class="bottom">
<button type="button" onclick="startVoice()">🎤</button>
<button type="button" onclick="showVideoMaker()">🎬</button>
<input id="userInput" placeholder="Ask FORANEO_AI anything..." onkeydown="if(event.key==='Enter') sendMsg()">
<button type="button" onclick="sendMsg()">➤</button>
</div>
<div class="small">FORANEO_AI • Created by FORANEO (PTY) LTD • FORANEO NET (MODERN LIFE, AIs) • FOREGO</div>

<script>
let pendingFile = null;
let pendingFileType = "";
let isTrying = false;
function getKey(){ return (localStorage.getItem('foraneo_key') || "").trim(); }
function getUser(){ try{ let u=JSON.parse(localStorage.getItem('foraneo_user')||"null"); if(u && !u.name) u.name = u.email ? u.email.split('@')[0] : "Friend"; return u; }catch(e){ return null; } }
function updateAuth(){
  let u=getUser();
  if(u){
    document.getElementById('userInfo').style.display='block';
    document.getElementById('userInfo').textContent='👋 Hi, '+u.name+' ('+u.email+') ✅ Logged in';
    document.getElementById('loginBtns').style.display='none';
    document.getElementById('logoutBtn').style.display='block';
  } else {
    document.getElementById('userInfo').style.display='none';
    document.getElementById('loginBtns').style.display='block';
    document.getElementById('logoutBtn').style.display='none';
  }
}
function loginGoogle(){
  let email=prompt("For Google Login, enter your Google email to continue:");
  if(!email) return;
  let name=email.split('@')[0] || "Friend";
  localStorage.setItem('foraneo_user', JSON.stringify({email:email,name:name,method:'Google'}));
  updateAuth();
  addMsg("ai","Welcome "+name+"! You are logged in with Google ✅");
}
function loginEmail(){
  let email=document.getElementById('emailInput').value.trim();
  let name=document.getElementById('nameInput').value.trim();
  if(!name && email) name=email.split('@')[0];
  if(!email||!email.includes('@')){ alert("Enter a valid email"); return; }
  if(!name) name="Friend";
  localStorage.setItem('foraneo_user', JSON.stringify({email:email,name:name,method:'Email'}));
  updateAuth();
  addMsg("ai","Welcome "+name+"! You are logged in with Email ✅");
}
function logout(){ localStorage.removeItem('foraneo_user'); updateAuth(); addMsg("ai","You logged out."); }
function showVoiceNote(){ alert("Voice Note: Tap mic below, speak, then Send."); }
function showVoiceCall(){ alert("Voice Call: Coming soon in FORANEO_AI"); }
function showVideoCall(){ alert("Video Call: Coming soon in FORANEO_AI"); }
function showVideoMaker(){ alert("Video maker: Type what video you want and Send."); }
function saveKey(){
  let k=document.getElementById('apiKey').value.trim();
  if(!k){ alert("Paste your key first"); return; }
  localStorage.setItem('foraneo_key', k);
  addMsg("ai", "Key saved! Length: " + k.length + " — Now type Hi and Send.");
}
function addMsg(who, text){
  let c=document.getElementById('chat');
  let d=document.createElement('div');
  d.className="msg "+(who==="me"?"me":"ai");
  d.textContent=text;
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
  return d;
}
function showHelp(){
  addMsg("ai", "📚 What FORANEO_AI can do\n\n1. WHAT FORANEO_AI CAN DO:\n• Code - write HTML, Python, JavaScript, apps, fix code errors\n• Entertain - jokes, stories, games, fun chats, music lyrics\n• Answer questions\n• Write essays, CVs, business plans, letters, emails, speeches\n• Read images / PDF / DOC / Files / MP3 / MP4\n• Explain school work - maths, English, science, homework\n• Help with business - foraneo (Pty) Ltd\n• Help with modern life, technology and AIs\n• Translate languages\n• Study, learn, revise and prepare for exams\n• Plan - trips, parties, budgets, daily life\n• Etc - just ask anything!\n\nJust type or upload a file.\n\n---\n2. FORANEO_AI INFORMATION:\nName: FORANEO_AI\nCreated by: FORANEO (PTY) LTD\nDepartment: FORANEO NET (MODERN LIFE, AIs)\nMotto: FOREGO\n\n✨ AI CREATION INSIDE INFORMATION:\nAI creations as FORANEO_AI:\n• Create stories, poems and songs\n• Create business names, logos ideas, slogans\n• Create video ideas, scripts and captions\n• Create images ideas, posters and designs\n• Create study notes, quizzes and flashcards\n• Create apps, websites and code\n• Create CVs, presentations and plans\n\nFORANEO_AI helps everyone, like you.");
}
function handleFile(input){
  let f=input.files[0];
  if(!f) return;
  pendingFileType=f.type;
  let reader=new FileReader();
  reader.onload=function(e){
    pendingFile=e.target.result;
    addMsg("me", "📎 Uploaded: "+f.name+" — Now type what you want me to do with it and Send.");
  };
  if(f.type.indexOf("image/")===0) reader.readAsDataURL(f);
  else reader.readAsText(f);
}
function startVoice(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){ alert("Voice not supported on this phone, please type."); return; }
  let Rec=window.SpeechRecognition || window.webkitSpeechRecognition;
  let r=new Rec();
  r.lang="en-ZA";
  r.onresult=function(e){ document.getElementById('userInput').value=e.results[0][0].transcript; sendMsg(); };
  r.start();
  addMsg("ai", "🎤 Listening... speak now.");
}
function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
async function sendMsg(){
  let input=document.getElementById('userInput');
  let text=input.value.trim();
  if(!text && !pendingFile) return;
  if(isTrying){ addMsg("ai","⏳ I'm already trying, please wait, don't send again..."); return; }
  let key=getKey();
  if(!key){ addMsg("ai","⚠️ Paste your OWN key in the white box at the TOP, tap Save Key, then ask again."); return; }
  addMsg("me", text || "Please read this file.");
  input.value="";
  let thinking=addMsg("ai","Thinking...");
  isTrying=true;
  try{
    let parts=[{text:"You are FORANEO_AI. Created by FORANEO (PTY) LTD, under FORANEO NET (MODERN LIFE, AIs). Motto is FOREGO. You help everyone. Answer this: "+(text || "Please explain this file.")}];
    if(pendingFile && pendingFileType.indexOf("image/")===0){
      let base64Data=pendingFile.split(",")[1];
      parts.push({inline_data:{mime_type:pendingFileType, data:base64Data}});
    }
    pendingFile=null;
    let models=["gemini-3.8-flash","gemini-2.0-flash","gemini-2.0-flash-lite","gemini-1.5-flash","gemini-1.5-flash-8b"];
    let attempt=0;
    while(true){
      attempt++;
      let model=models[(attempt-1) % models.length];
      thinking.textContent="Thinking... Trying "+model+" (try "+attempt+") - FORANEO_AI will NOT give up, keep waiting...";
      try{
        let url="https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+key;
        let res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:parts}]})});
        let data=await res.json();
        if(data.error){
          let msg=data.error.message || "";
          // If key is really wrong, stop and tell user - otherwise keep retrying
          if(msg.indexOf("API key not valid")>-1 || msg.indexOf("API_KEY_INVALID")>-1){
            thinking.textContent="❌ Your key is wrong. Go to aistudio.google.com/apikey, create NEW key, paste FULL key, Save Key, try again.";
            break;
          }
          thinking.textContent="⏳ Google busy / "+msg+" - Trying again in 5 sec... (try "+attempt+") Don't send again, I'm still trying...";
          await sleep(5000);
          continue;
        }
        let reply=(data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || "";
        if(reply){ thinking.textContent=reply; break; }
        thinking.textContent="⏳ Empty reply, trying again... (try "+attempt+")";
        await sleep(3000);
      }catch(e){
        thinking.textContent="⏳ Internet glitch (Failed to fetch) - Trying again in 5 sec... (try "+attempt+") Don't send again, I'm still trying...";
        await sleep(5000);
      }
    }
  }catch(e){ thinking.textContent="Error: "+e.message+" - trying again..."; }
  isTrying=false;
}
window.onload=function(){
  updateAuth();
  let k=getKey();
  if(k) document.getElementById('apiKey').value=k;
  let u=getUser();
  if(u) addMsg("ai","👋 Welcome back "+u.name+"! I'm FORANEO_AI. Created by FORANEO (PTY) LTD, under FORANEO NET (MODERN LIFE, AIs). Motto: FOREGO. Paste your OWN key if you haven't, then ask me anything.");
  else addMsg("ai","👋 Hi! I'm FORANEO_AI. Created by FORANEO (PTY) LTD, under FORANEO NET (MODERN LIFE, AIs). Motto: FOREGO. Please Login with Google or Email at the top, paste your OWN key, then ask me anything.");
};
</script>
</body>
</html>
