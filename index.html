<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORANEO_AI - All Things ON</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7ff;color:#222}
.header{background:linear-gradient(135deg,#1a5cff,#0d3fbf);color:#fff;text-align:center;padding:16px;position:relative}
.header h1{margin:0;font-size:28px;font-weight:900}.live{position:absolute;right:10px;top:10px;background:#fff;color:#1a5cff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:8px;padding:10px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;position:sticky;top:0;z-index:10}
.tab{padding:8px 16px;border-radius:22px;border:1px solid #dbe2ff;background:#fff;color:#1a5cff;font-size:14px;white-space:nowrap;cursor:pointer;font-weight:600}.tab.active{background:#1a5cff;color:#fff}
#chat{padding:12px;padding-bottom:230px;display:flex;flex-direction:column;gap:10px;min-height:70vh}
.bubble{max-width:88%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.user{align-self:flex-end;background:#1a5cff;color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#fff;border:1px solid #e5eaff;border-bottom-left-radius:4px}
.ai img{max-width:100%;border-radius:10px;margin-top:8px;display:block;border:1px solid #ddd}
video{width:100%;border-radius:12px;background:#000}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;border-top:1px solid #e8ecff;z-index:20}
.upload{padding:9px 12px;border:1.5px dashed #8fa6ff;border-radius:20px;margin-bottom:8px;font-size:13px;color:#1a5cff;background:#f8f9ff;cursor:pointer;font-weight:600}
.pills{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.pill{border:1px solid #dbe2ff;background:#f8f9ff;color:#1a5cff;padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer}
.row{display:flex;gap:8px}.row input{flex:1;padding:12px 16px;border-radius:25px;border:1px solid #dbe2ff;outline:none}.row button{background:#1a5cff;color:#fff;border:none;padding:12px 22px;border-radius:25px;font-weight:700}
#callBox{display:none;position:fixed;top:70px;left:8px;right:8px;background:#111;color:#fff;border-radius:16px;padding:10px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="header"><div class="live" onclick="videoCall()">LIVE CAM • ON</div><h1>FORANEO_AI</h1><p>FORANEO (PTY) LTD • Foraneo Net Department<br>KARABO • All Things ON</p></div>
<div class="tabs">
<div class="tab active" onclick="switchTab('chat')">💬 Chat</div>
<div class="tab" onclick="switchTab('image')">🎨 Image / Logo</div>
<div class="tab" onclick="switchTab('calc')">🧮 Calculator</div>
<div class="tab" onclick="switchTab('games')">🎮 Games</div>
</div>
<div id="chat"></div>
<div id="callBox">
<video id="cam" autoplay playsinline muted></video>
<div id="callStatus" style="text-align:center;padding:8px;font-size:13px">LIVE CAM CONNECTED - Mic ON</div>
<div style="display:flex;gap:8px"><button onclick="endCall()" style="flex:1;padding:12px;background:#ff2a2a;color:#fff;border:none;border-radius:22px;font-weight:700">End Call</button><button onclick="speakLast()" style="flex:1;padding:12px;background:#1a5cff;color:#fff;border:none;border-radius:22px">🔊 Speak</button></div>
</div>
<div class="bar">
<div class="upload" onclick="document.getElementById('file').click()">🏀 📎 Upload Image / Document / File / MP3 / MP4 - Tap to upload</div>
<input type="file" id="file" hidden accept="image/*,.pdf,.doc,.docx,.mp3,.mp4,.txt">
<div class="pills"><div class="pill" onclick="startVoice()">▶️ Voice Note</div><div class="pill" onclick="voiceCall()">🎤 Voice Call</div><div class="pill" onclick="videoCall()">👤 Video Call - LIVE CAM</div></div>
<div class="row"><input id="input" placeholder="Ask FORANEO_AI... generate lion photo, read my file" /><button id="sendBtn">Send</button></div>
</div>
<script>
let lastImageBase64=null, lastImageName='', lastAnswer='', stream=null, chatMemory=[];
function add(role,text,imgSrc){
  let d=document.createElement('div'); d.className='bubble '+(role==='user'?'user':'ai');
  d.innerHTML=(role==='user'?'👤 <b>You:</b> ':'🤖 <b>FORANEO_AI:</b> ')+escapeHtml(text).replace(/\n/g,'<br>');
  if(imgSrc){ let im=document.createElement('img'); im.src=imgSrc; d.appendChild(document.createElement('br')); d.appendChild(im); }
  document.getElementById('chat').appendChild(d); window.scrollTo(0,document.body.scrollHeight); if(role==='ai') lastAnswer=text;
  chatMemory.push({role,text}); if(chatMemory.length>60) chatMemory.shift();
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
add('ai','I am FORANEO AI - I am created by FORANEO (PTY) LTD to help with everything.\n\n✅ I can READ your uploaded photos and documents now\n✅ I can GENERATE lion photos, logos, anything\n✅ Voice Call & Video LIVE CAM connect with mic/camera\n✅ Calculator & Games\n\nTry: Upload a photo then say "Read it" or say "Generate a lion photo"');

function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  if(t==='chat') document.querySelectorAll('.tab')[0].classList.add('active');
  if(t==='image'){ document.getElementById('input').value='Generate a lion photo, realistic, 4k'; document.getElementById('input').focus(); add('ai','Image mode: Type what you want - e.g. "Generate a lion photo" or "Create FORANEO logo blue"'); }
  if(t==='calc'){ let q=prompt('Enter calculation e.g. 25*4+10 or (100+50)/2'); if(q){ try{ let r=Function('"use strict";return ('+q+')')(); add('ai','🧮 Calculator: '+q+' = '+r); }catch(e){ add('ai','Calculator error: '+e.message); } } }
  if(t==='games'){ add('ai','🎮 Games:\n1. Type "play guess number" - I think of 1-100\n2. Type "play quiz" - general knowledge\n3. Type "play rock paper scissors"\nWhat game you want?'); }
}
function speakLast(){ if(!lastAnswer) return; speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(lastAnswer.slice(0,600)); u.lang='en-US'; speechSynthesis.speak(u); }
function endCall(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } document.getElementById('callBox').style.display='none'; document.getElementById('cam').srcObject=null; add('ai','Call ended.'); }
async function voiceCall(){
  try{ add('ai','🎤 Voice Call: Connecting... please allow microphone'); stream=await navigator.mediaDevices.getUserMedia({audio:true}); document.getElementById('callBox').style.display='block'; document.getElementById('callStatus').textContent='🎤 Voice Call CONNECTED - Listening...'; add('ai','🎤 CONNECTED! Mic is ON. Speak now - say "hello FORANEO"');
    let SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ let rec=new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=false; rec.start(); rec.onresult=e=>{ let txt=e.results[e.results.length-1][0].transcript.trim(); if(txt.length>2){ add('user','🎤 Voice: '+txt); document.getElementById('input').value=txt; send(true); } }; rec.onerror=()=>{}; }
  }catch(e){ add('ai','Voice Call failed: '+e.message+'. Allow mic in Chrome > Settings > Privacy > Microphone.'); }
}
async function videoCall(){
  try{ add('ai','👤 Video Call - LIVE CAM: Starting camera...'); stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); document.getElementById('cam').srcObject=stream; document.getElementById('callBox').style.display='block'; document.getElementById('callStatus').textContent='👤 LIVE CAM CONNECTED - Video ON'; add('ai','👤 LIVE CAM CONNECTED! I can see you now. Video call is ON.'); }
  catch(e){ add('ai','LIVE CAM failed: '+e.message+'. Allow camera in browser settings.'); }
}
function startVoice(){ let SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){add('ai','Voice Note not supported');return;} let r=new SR(); r.lang='en-US'; r.start(); add('ai','▶️ Listening for Voice Note...'); r.onresult=e=>{ document.getElementById('input').value=e.results[0][0].transcript; add('user','🎤 Voice Note: '+e.results[0][0].transcript); send(); }; }

document.getElementById('file').addEventListener('change', function(){
  let f=this.files[0]; if(!f) return; lastImageName=f.name;
  if(f.type.startsWith('image/')){
    let reader=new FileReader();
    reader.onload=e=>{
      lastImageBase64=e.target.result;
      add('user','Uploaded: '+f.name, lastImageBase64);
      add('ai','✅ Got your image: '+f.name+'! I can now READ it. It is saved. Now type "Read it" or "What is in this image?" and I will describe everything inside like Meta AI does.');
    };
    reader.readAsDataURL(f);
  } else { add('user','Uploaded: '+f.name); lastImageBase64=null; add('ai','Got file: '+f.name+'. What should I do? Summarize?'); }
});

async function send(isVoice=false){
  let input=document.getElementById('input'); let txt=input.value.trim(); if(!txt) return; input.value='';
  let lower=txt.toLowerCase();
  if(!lower.includes('uploaded') && !lower.startsWith('🎤')) add('user', txt);
  let typing=document.createElement('div'); typing.className='bubble ai'; typing.textContent='🤖 FORANEO_AI: Typing...'; document.getElementById('chat').appendChild(typing); window.scrollTo(0,document.body.scrollHeight);

  const SYS=`You are FORANEO_AI. Identity: "I am FORANEO AI - I am created by FORANEO (PTY) LTD to help with everything." Never say Meta. Never use brackets [Name] [Teacher] [Assignment] [Date]. Use real: Dr. Smith, Business Management Assignment 1, 10 November 2026, Karabo Foraneo. If user asks to read image/file, describe it fully. Help with everything. If formal email requested, write full formal email.`;

  try{
    // IMAGE GENERATION DETECTION - FIXES "Generate a lion photo" bug - now detects all variations
    let isImageGen = lower.includes('generate') || lower.includes('create') || lower.includes('draw') || lower.includes('make') || lower.includes('design');
    let wantsVisual = lower.includes('image') || lower.includes('photo') || lower.includes('picture') || lower.includes('logo') || lower.includes('lion') || lower.includes('wallpaper');
    if(isImageGen && wantsVisual || lower.startsWith('generate a') || lower.startsWith('create a')){
      let prompt=txt.replace(/generate|create|draw|make|design|a photo|a image|an image|photo|image/gi,'').trim();
      if(prompt.length<3) prompt=txt;
      typing.textContent='🤖 FORANEO_AI: Generating "'+prompt+'" ...';
      let img=await puter.ai.txt2img(prompt, {model:'dall-e-3'});
      typing.remove(); add('ai','Here is your generated image for: "'+prompt+'" - Created by FORANEO AI', img.src);
      if(isVoice) speakLast(); return;
    }

    let messages=[{role:'system',content:SYS}];
    // IF USER SAYS READ IT AND IMAGE EXISTS - SEND IMAGE TO AI FOR VISION
    if(lastImageBase64 && (lower.includes('read') || lower.includes('my file') || lower.includes('what') || lower.includes('see') || lower.includes('describe') || lower.includes('in this') || lower.includes('summarize'))){
      messages.push({role:'user', content:[
        {type:'text', text: txt+' (User uploaded image named '+lastImageName+'. Read, analyze, OCR all text visible, describe content fully.)'},
        {type:'image_url', image_url:{url:lastImageBase64}}
      ]});
    } else {
      // include recent chat memory for context
      chatMemory.slice(-10).forEach(m=>{ if(m.role) messages.push({role:m.role==='user'?'user':'assistant', content:m.text}); });
      messages.push({role:'user', content:txt});
    }

    let res=await puter.ai.chat(messages, {model:'gpt-4o'});
    let out=res.message.content || res.toString();
    out=out.replace(/\[Lecturer\/Teacher Name\]/gi,'Dr. Smith').replace(/\[Assignment Name\]/gi,'Business Management Assignment 1').replace(/\[Due Date\]/gi,'10 November 2026').replace(/\[Your Name\]/gi,'Karabo Foraneo').replace(/\[.*?\]/g,'').trim();
    typing.remove(); add('ai', out);
    if(isVoice){ speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(out.slice(0,400)); u.lang='en-US'; speechSynthesis.speak(u); }
  }catch(e){ typing.remove(); add('ai','Error: '+e.message+' - Check internet. If image generation fails, try again with simpler prompt.'); }
}
document.getElementById('sendBtn').addEventListener('click', ()=>send(false));
document.getElementById('input').addEventListener('keydown', e=>{ if(e.key==='Enter') send(false); });
</script>
</body>
</html>
