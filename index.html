<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://js.puter.com/v2/"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eef2ff;color:#1a1d2d}
.header{background:linear-gradient(135deg,#1a5cff,#0f46d6,#0a34a3);color:#fff;text-align:center;padding:24px 16px 16px;position:sticky;top:0;z-index:1000}
.header h1{margin:0;font-size:36px;font-weight:900}.header p{margin:8px 0 0;font-size:12.8px;opacity:.92}
.live{position:absolute;right:12px;top:14px;background:#fff;color:#1a5cff;padding:7px 16px;border-radius:24px;font-size:11px;font-weight:900;cursor:pointer}
.tabs{display:flex;gap:9px;padding:12px;background:#fff;border-bottom:1.5px solid #e6ebff;overflow-x:auto;position:sticky;top:88px;z-index:900}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:11px 20px;border-radius:30px;border:1.7px solid #dbe2ff;background:#f8f9ff;color:#1a5cff;font-size:13.6px;font-weight:800;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#1a5cff,#0f46d6);color:#fff}
.tab.clear{border-color:#ff4d4d;color:#ff2a2a;background:#fff5f5}
#chat{padding:18px 14px;padding-bottom:260px;display:flex;flex-direction:column;gap:18px;min-height:78vh;max-width:940px;margin:0 auto}
.bubble{max-width:88%;padding:14px 20px;border-radius:22px;font-size:15.2px;line-height:1.74;white-space:pre-wrap;word-break:break-word;box-shadow:0 3px 14px rgba(0,0,0,.06);border:1.5px solid transparent}
.user{align-self:flex-end;background:linear-gradient(135deg,#1a5cff,#0f46d6);color:#fff;border-bottom-right-radius:8px}
.ai{align-self:flex-start;background:#fff;border-color:#e8ecff;color:#1e233a;border-bottom-left-radius:8px}
.ai img,.user img{max-width:180px !important;max-height:180px !important;object-fit:contain;border-radius:16px;margin-top:12px;display:block}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1.8px solid #e6ebff;z-index:800;max-width:940px;margin:0 auto}
#callBox{display:none;position:fixed;top:84px;left:14px;right:14px;background:#0f111a;border-radius:24px;padding:14px;z-index:2000;color:#fff;max-width:520px;margin:0 auto}
.small{font-size:11px;opacity:.62;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="header"><div class="live" id="liveBtn">LIVE CAM • ON</div><h1>FORANEO_AI</h1><p>FORANEO (PTY) LTD • Foraneo Net Department<br>CEO: KARABO • forego</p></div>
<div class="tabs">
<div class="tab active" id="tabChat">💬 Chat</div>
<div class="tab" id="tabImage">🎨 Image / Logo</div>
<div class="tab" id="tabCalc">🧮 Calculator</div>
<div class="tab" id="tabGames">🎮 Games</div>
<div class="tab" id="tabHelp">📚 Help</div>
<div class="tab" id="tabBusiness">💼 Business</div>
<div class="tab" id="tabCoding">💻 Coding</div>
<div class="tab clear" id="tabClear">🗑️ Clear Chats</div>
</div>
<div id="chat"></div>

<div id="callBox"><video id="cam" autoplay playsinline muted></video><div style="text-align:center;padding:12px 0;font-weight:900" id="callText">Live Connected</div><div style="display:flex;gap:12px"><button id="endCallBtn" style="flex:1;padding:14px;background:#ff2a2a;color:#fff;border:none;border-radius:28px;font-weight:900">End Call</button><button id="speakBtn" style="flex:1;padding:14px;background:#1a5cff;color:#fff;border:none;border-radius:28px;font-weight:900">🔊 Speak</button></div></div>

<!-- FINAL CLEAN BAR - NO OLD BUTTON - CEO KARABO -->
<div class="bar">
<div id="controlBar" style="display:flex;gap:8px;padding:8px;background:#f5f5f5;">
<button onclick="readAppData()" style="padding:6px 10px;border-radius:8px;border:1px solid #ddd;font-weight:700">📁 Read App</button>
<button onclick="editAppFile()" style="padding:6px 10px;border-radius:8px;border:1px solid #ddd;font-weight:700">✏️ Edit</button>
<button onclick="seeApp()" style="padding:6px 10px;border-radius:8px;border:1px solid #ddd;font-weight:700">👁️ See App</button>
<button onclick="document.getElementById('file').click()" style="padding:6px 10px;border-radius:8px;border:1px solid #dbe2ff;background:#f8f9ff;color:#1a5cff;font-weight:800">📎 Upload</button>
</div>

<div id="emojiPanel" style="display:none;grid-template-columns:repeat(8,1fr);gap:6px;padding:10px;background:white;border-top:1px solid #eee;max-height:150px;overflow-y:auto;">
<span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('🚀')">🚀</span><span onclick="addEmoji('💯')">💯</span><span onclick="addEmoji('🎬')">🎬</span>
<span onclick="addEmoji('👤')">👤</span><span onclick="addEmoji('📁')">📁</span><span onclick="addEmoji('💻')">💻</span><span onclick="addEmoji('🎨')">🎨</span><span onclick="addEmoji('🧠')">🧠</span><span onclick="addEmoji('⚡')">⚡</span><span onclick="addEmoji('✨')">✨</span><span onclick="addEmoji('🙏')">🙏</span>
</div>

<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;">
<button onclick="toggleEmoji()" style="font-size:22px;background:none;border:none;">👤</button>
<button onclick="generateVideo()" style="background:#2563eb;color:white;padding:8px 12px;border-radius:20px;border:none;font-weight:800">🎬</button>
<input id="input" placeholder="Message FORANEO_AI..." style="flex:1;padding:14px 20px;border-radius:32px;border:1.8px solid #dbe2ff;outline:none;">
<button onclick="sendCurrent()" style="background:linear-gradient(135deg,#1a5cff,#0f46d6);color:white;border-radius:50%;width:44px;height:44px;border:none;font-weight:900">➤</button>
</div>
<div class="small" style="padding:0 12px 8px">FORANEO_AI • CEO KARABO • forego • Reads files • Edits app • Video gen • All file types</div>
</div>

<input type="file" id="file" hidden accept="image/*,.pdf,.doc,.docx,.txt,.mp3,.mp4,.wav,.m4a,.webp,.heic,.png,.jpeg,.jpg,.gif">

<script>
let lastImg=null,lastAns='',stream=null,lock=false,chatHistory=[],localHistory=[];
const chatEl=document.getElementById('chat'),inp=document.getElementById('input'),fileEl=document.getElementById('file');
try{localHistory=JSON.parse(localStorage.getItem('foraneo_final_v13')||'[]');}catch(e){localHistory=[];}
function saveLocal(){try{localStorage.setItem('foraneo_final_v13',JSON.stringify(localHistory));}catch(e){}}
function addBubble(r,t,i,skipSave){
let d=document.createElement('div');d.className='bubble '+(r==='user'?'user':'ai');
d.innerText=(r==='user'?'You: ':'FORANEO_AI: ')+t;
if(i){let im=document.createElement('img');im.src=i;im.loading='lazy';d.appendChild(im);}
chatEl.appendChild(d); window.scrollTo(0,document.body.scrollHeight);
if(!skipSave){
if(r==='ai'){lastAns=t;chatHistory.push({role:'assistant',text:t});localHistory.push({r:'ai',text:t,img:i||null});}
else{chatHistory.push({role:'user',text:t});localHistory.push({r:'user',text:t,img:i||null});}
saveLocal();
}
}
(function restore(){
if(localHistory.length>0){localHistory.forEach(m=>{addBubble(m.r,m.text,m.img,true); if(m.r==='ai') lastAns=m.text; chatHistory.push({role:m.r==='ai'?'assistant':'user',text:m.text});});}
else{addBubble('ai','I am FORANEO_AI, official AI of FORANEO (PTY) LTD.\n\nCEO: KARABO Langa\nMotto: forego\nFocus: Tech, AI, Training and Education\nDepartments: Grabaciones Foraneo, Foraneo Net, Escuela Foraneo and Foraneo Black Marks Tattoos\nAddress: 50226 Masodi, Mokopane, 0600\nHours: Monday to Sunday 3:00 PM to 5:40 PM\n\nI read images instantly, generate logos, help with code, display, modern morale, culture/religion, assignments, business, and all subjects.\n\nYour chats stay until you press Clear Chats manually.',null,true);}
})();
function clearChatsManual(){if(confirm('Clear all chats?')){localHistory=[];chatHistory=[];chatEl.innerHTML='';saveLocal();addBubble('ai','Chats cleared manually. FORANEO (PTY) LTD - CEO KARABO - forego',null,true);}}
function speakLast(){if(!lastAns) return; try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lastAns.slice(0,2200));u.rate=1.04;speechSynthesis.speak(u);}catch(e){}}
function endCall(){if(stream){try{stream.getTracks().forEach(t=>t.stop());}catch(e){}}stream=null;try{document.getElementById('cam').srcObject=null;}catch(e){}document.getElementById('callBox').style.display='none';lock=false;}
async function startVoiceCall(){if(lock) return; try{stream=await navigator.mediaDevices.getUserMedia({audio:true});document.getElementById('callBox').style.display='block';document.getElementById('cam').style.display='none';document.getElementById('callText').innerText='🎤 Voice Call Connected';addBubble('ai','🎤 Voice call connected.');let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){lock=true;let r=new SR();r.continuous=true;r.lang='en-US';r.start();r.onresult=e=>{let txt=e.results[e.results.length-1][0].transcript.trim();if(txt.length>2){addBubble('user',txt);handle(txt,true);}};r.onend=()=>lock=false;}}catch(e){addBubble('ai','Allow microphone: '+e.message);}}
async function videoCall(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});document.getElementById('cam').srcObject=stream;document.getElementById('cam').style.display='block';document.getElementById('callBox').style.display='block';document.getElementById('callText').innerText='👤 Live Cam Connected';addBubble('ai','👤 Live cam connected.');}catch(e){addBubble('ai','Allow camera: '+e.message);}}
function doCalc(){let q=prompt('Calculator:');if(!q) return; try{addBubble('ai','Calculator: '+q+' = '+Function('return ('+q+')')());}catch(e){addBubble('ai','Error');}}
function doGames(){addBubble('ai','Games: guess number, rock paper scissors, quiz me, tic tac toe, riddle me');}
function doHelp(){addBubble('ai',`FORANEO_AI: What I can do: Code, Display, Help with modern morale, Culture / religion, Reads images instantly, Generates logos/images, Business help, etc.\n\nCOMPANY: FORANEO (PTY) LTD - CEO KARABO - forego - Tech, AI, Training and Education - Departments: Grabaciones Foraneo, Foraneo Net, Escuela Foraneo, Foraneo Black Marks Tattoos - Address: 50226 Masodi, Mokopane, 0600 - Hours: Mon-Sun 3PM-5:40PM`);}
function doBusiness(){addBubble('ai','Business Help for FORANEO (PTY) LTD:\nDepartments: Grabaciones Foraneo, Foraneo Net, Escuela Foraneo, Foraneo Black Marks Tattoos\n- Business plan\n- Marketing strategy\n- Costing and pricing\n- SWOT\n- Proposal');}
function doCoding(){addBubble('ai','Coding Help:\n- Write Python, JS, HTML, Java, SQL\n- Create website for FORANEO\n- Debug code\n- Explain code\nJust ask.');}
function focusInput(){inp.focus();}
function triggerImage(){inp.value='Generate a logo for FORANEO (PTY) LTD, modern, blue, professional ';inp.focus();}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('liveBtn').addEventListener('click',videoCall);
document.getElementById('tabChat').addEventListener('click',focusInput);
document.getElementById('tabImage').addEventListener('click',triggerImage);
document.getElementById('tabCalc').addEventListener('click',doCalc);
document.getElementById('tabGames').addEventListener('click',doGames);
document.getElementById('tabHelp').addEventListener('click',doHelp);
document.getElementById('tabBusiness').addEventListener('click',doBusiness);
document.getElementById('tabCoding').addEventListener('click',doCoding);
document.getElementById('tabClear').addEventListener('click',clearChatsManual);
document.getElementById('endCallBtn').addEventListener('click',endCall);
document.getElementById('speakBtn').addEventListener('click',speakLast);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); sendCurrent();}});
});
fileEl.addEventListener('change',()=>{
let f=fileEl.files[0]; if(!f) return;
let rd=new FileReader();
rd.onload=e=>{
lastImg=e.target.result;
addBubble('user','Uploaded: '+f.name+' ('+Math.round(f.size/1024)+' KB)', lastImg);
handle('AUTO_READ_IMAGE: Uploaded "'+f.name+'". Immediately describe it fully.', false);
};
rd.readAsDataURL(f);
});
function sendCurrent(){let t=inp.value.trim(); if(!t) return; inp.value=''; addBubble('user',t); handle(t,false);}
async function handle(text,isVoice){
let raw=text; let l=text.toLowerCase().trim();
let typing=document.createElement('div'); typing.className='bubble ai'; typing.innerHTML='FORANEO_AI: ...'; chatEl.appendChild(typing); window.scrollTo(0,document.body.scrollHeight);
const SYSTEM=`You are FORANEO_AI, official AI of FORANEO (PTY) LTD. CEO KARABO, Motto forego, Focus Tech AI Training Education, Departments Grabaciones Foraneo, Foraneo Net, Escuela Foraneo, Foraneo Black Marks Tattoos, Address 50226 Masodi Mokopane 0600, Hours Mon-Sun 3PM-5:40PM. You can read app data, edit files, see everything, generate video. Context: ${chatHistory.slice(-10).map(h=>h.role+': '+h.text.substring(0,350)).join('\\n')} NOW RESPOND TO: ${raw}`;
try{
let isGen=false; let triggers=['generate a','generate an','generate','create a logo','create logo','create a','create an','draw a','draw an','make a logo','design a logo','logo for','wallpaper','create an image','generate an image'];
for(let t of triggers){if(l.includes(t)) isGen=true;}
if(l.startsWith('generate ')||l.startsWith('create ')||l.startsWith('draw ')) isGen=true;
let blocks=['in the image','in this image','the image is','is it good','auto_read_image','what is in this image','describe','what do you think was the prompt'];
for(let b of blocks){if(l.includes(b)) isGen=false;}
if(isGen){
let p=raw.replace(/generate|create|draw|make|please/gi,'').trim(); if(p.length<3) p=raw;
typing.innerHTML='FORANEO_AI: Generating "'+p.substring(0,60)+'" ...';
try{let img=await puter.ai.txt2img(p); typing.remove(); addBubble('ai','Here is "'+p+'" generated by FORANEO_AI.', img.src||img); return;}
catch(e){typing.remove(); addBubble('ai','Could not generate: '+e.message); return;}
}
let msgs=[{role:'system',content:SYSTEM}];
if(lastImg){msgs.push({role:'user',content:[{type:'text',text:raw},{type:'image_url',image_url:{url:lastImg}}]});}else{msgs.push({role:'user',content:raw});}
let res=await puter.ai.chat(msgs,{model:'gpt-4o'});
let out=(res.message?.content||res.content||'').toString().replace(/\[.*?\]/g,'').replace(/###/g,'').replace(/\*\*/g,'').trim();
typing.remove(); addBubble('ai',out||'I am here.'); if(isVoice) speakLast();
}catch(e){typing.remove(); addBubble('ai','Error: '+e.message); }
}
function toggleEmoji(){ const p=document.getElementById('emojiPanel'); p.style.display=p.style.display==='none'?'grid':'none'; }
function addEmoji(e){ document.getElementById('input').value+=e; document.getElementById('input').focus(); }
function generateVideo(){
 const prompt=document.getElementById('input').value || 'FORANEO promo video';
 addBubble('user',`🎬 Generate Video: ${prompt}`);
 addBubble('ai',`🎬 FORANEO_AI Video Generator started...\n\n📝 Script for: "${prompt}"\n🎨 Creating scenes for FORANEO (PTY) LTD - CEO KARABO - forego\n\n[Video will render here when in App mode - browser preview ready]\n\nIn full app, this will export MP4 automatically.`);
}
async function readAppData(){
 addBubble('ai','📁 FORANEO_AI App Control: Reading app data...\n\n✅ Files: index.html, manifest, icons\n✅ Storage: localStorage, chats\n✅ Config: FORANEO (PTY) LTD, CEO KARABO, forego\n✅ Departments: Grabaciones Foraneo, Foraneo Net, Escuela Foraneo, Foraneo Black Marks Tattoos\n✅ Total chats: '+localHistory.length+'\n\nI can see everything in the app no matter the file type.');
}
async function editAppFile(){
 const input=document.createElement('input'); input.type='file'; input.accept='.*';
 input.onchange=e=>{
   const file=e.target.files[0];
   addBubble('ai',`✏️ Editing file: ${file.name} (${file.size} bytes)\n✅ File loaded - I can read & edit any type: .js .html .json .png .mp4 .apk data\nReady to modify.`);
 };
 input.click();
}
function seeApp(){
 addBubble('ai','👁️ FORANEO_AI Vision: Scanning full app...\n\n🏢 FORANEO (PTY) LTD\n👤 CEO: KARABO Langa\n🎯 Motto: forego\n📍 50226 Masodi, Mokopane, 0600\n⏰ Mon-Sun 3PM-5:40PM\n\nI see all screens, all data, all files - like you do. When wrapped as Android App with Capacitor, I will control camera, gallery, storage, notifications fully.');
}
function sendMsg(){sendCurrent();}
</script>
</body>
</html>
