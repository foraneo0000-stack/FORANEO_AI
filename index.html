<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORANEO_AI</title>
<style>
body{background:#000;color:#fff;font-family:Arial,sans-serif;margin:0;padding:10px}
#chat{max-width:600px;margin:0 auto;padding-bottom:80px}
.msg{background:#1e1e1e;padding:12px 14px;border-radius:15px;margin:10px 0;line-height:1.5}
.user{background:#00d8a0;color:#000;text-align:right;margin-left:60px}
#box{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:8px;max-width:600px;margin:0 auto}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff}
button{padding:12px 18px;border-radius:20px;border:none;background:#00d8a0;font-weight:bold}
</style>
</head>
<body>
<div id="chat">
<div class="msg">Welcome to FORANEO_AI. Made by FORANEO (PTY) LTD - Foraneo Net. Ask me about FORANEO, its sections, address or hours.</div>
</div>
<div id="box">
<input id="q" placeholder="Ask FORANEO_AI anything...">
<button onclick="ask()">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');

function add(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + (cls||'');
  d.innerText = text;
  chat.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
}

function getAnswer(q){
  q = q.toLowerCase();

  if(q.includes('who made') || q.includes('who created') || q.includes('made by')){
    return "FORANEO_AI was made by FORANEO (PTY) LTD - Foraneo Net.";
  }

  if(q.includes('hours') || q.includes('open') || q.includes('time') || q.includes('close')){
    return "FORANEO (PTY) LTD is open Monday to Sunday, 3:00 PM to 5:40 PM. Address: 50226 Masodi, Mokopane, 0600";
  }

  if(q.includes('foraneo') || q.includes('company') || q.includes('address') || q.includes('section') || q.includes('about')){
    return "FORANEO (PTY) LTD - Foraneo Net. Address: 50226 Masodi, Mokopane, 0600. Hours: Monday to Sunday 3:00 PM to 5:40 PM. Sections: Foraneo Net, Foraneo AI, Foraneo Services.";
  }

  return "I am FORANEO_AI by FORANEO (PTY) LTD. Ask me about FORANEO, its sections, address or hours. Hours are Monday to Sunday 3:00 PM to 5:40 PM.";
}

function ask(){
  const v = input.value.trim();
  if(!v) return;
  add(v, 'user');
  add(getAnswer(v), '');
  input.value = '';
}
input.addEventListener('keydown', e => { if(e.key === 'Enter') ask(); });
</script>
</body>
</html>
