<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORANEO_AI - foraneo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#eef2ff;min-height:100vh;display:flex;flex-direction:column}
.top{background:#fff;padding:14px;text-align:center;border-bottom:1px solid #ddd}
.logo{width:150px;max-width:70%;border:3px solid #2b7cff;border-radius:14px}
.keybox{margin:12px auto;max-width:500px;background:#fff;padding:10px;border-radius:12px;display:flex;gap:8px}
.keybox input{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px}
.keybox button{background:#2b7cff;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:700px;width:100%;margin:0 auto}
.msg{background:#fff;padding:12px 14px;border-radius:14px;max-width:85%;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:#2b7cff;color:#fff}
.ai{align-self:flex-start}
.tools{max-width:700px;width:100%;margin:0 auto;padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:8px}
.tools button,.tools label{background:#fff;border:1px solid #dbe4ff;padding:8px 14px;border-radius:20px;font-weight:bold;color:#2b7cff;cursor:pointer}
.bottom{max-width:700px;width:100%;margin:0 auto;padding:0 14px 16px;display:flex;gap:8px;align-items:center}
.bottom input{flex:1;padding:13px;border:1px solid #ccc;border-radius:25px;outline:none}
.bottom button{width:48px;height:48px;border-radius:50%;border:0;background:#2b7cff;color:#fff;font-size:20px}
.small{text-align:center;font-size:12px;color:#888;padding-bottom:8px}
img.prev{max-width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>

<div class="top">
<img class="logo" src="https://via.placeholder.com/300x150?text=foraneo+(Pty)+Ltd" alt="foraneo">
<div class="keybox">
<input id="apiKey" type="password" placeholder="Paste your Gemini API Key here">
<button onclick="saveKey()">Save Key</button>
</div>
</div>

<div id="chat"></div>

<div class="tools">
<label>🏀 📎 Upload Image / Document / File / MP3 / MP4 / PDF / DOC <input type="file" id="fileInput" hidden onchange="handleFile(this)"></label>
<button onclick="alert('Voice Note: Tap mic below, speak, then Send.')">▶️ Voice Note</button>
<button onclick="alert('Voice Call: Coming soon in FORANEO_AI')">🎤 Voice Call</button>
<button onclick="alert('Video Call: Coming soon in FORANEO_AI')">👤 Video Call</button>
<button onclick="showHelp()">📚 What FORANEO can do?</button>
</div>

<div class="bottom">
<button onclick="startVoice()">🎤</button>
<button onclick="alert('Video maker: Type what video you want and Send.')">🎬</button>
<input id="userInput" placeholder="Ask FORANEO_AI anything..." onkeydown="if(event.key==='Enter') sendMsg()">
<button onclick="sendMsg()">➤</button>
</div>
<div class="small">FORANEO_AI • foraneo</div>

<script>
let pendingFile = null;
let pendingFileType = "";

function getKey(){ return localStorage.getItem('foraneo_key') || ""; }
window.onload = function(){
  const k = getKey();
  if(k) document.getElementById('apiKey').value = k;
  addMsg("ai", "👋 Hi! I'm FORANEO_AI. Paste your key at the top if you haven't, then ask me anything.");
};
function saveKey(){
  const k = document.getElementById('apiKey').value.trim();
  if(!k){ alert("Paste your key first"); return; }
  localStorage.setItem('foraneo_key', k);
  addMsg("ai", "Key saved! Length: " + k.length + " — Now type Hi and Send.");
}
function addMsg(who, text){
  const c = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = "msg " + (who === "me" ? "me" : "ai");
  d.textContent = text;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
  return d;
}
function showHelp(){
  addMsg("ai", "📚 What FORANEO can do?\n\n• Answer questions\n• Write essays, CVs, business plans\n• Read images / PDF / DOC\n• Explain school work\n• Help with business - foraneo (Pty) Ltd\n\nJust type or upload a file.");
}
function handleFile(input){
  const f = input.files[0];
  if(!f) return;
  pendingFileType = f.type;
  const reader = new FileReader();
  reader.onload = function(e){
    pendingFile = e.target.result;
    addMsg("me", "📎 Uploaded: " + f.name + " — Now type what you want me to do with it and Send.");
  };
  if(f.type.startsWith("image/")) reader.readAsDataURL(f);
  else reader.readAsText(f);
}
function startVoice(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){ alert("Voice not supported on this phone, please type."); return; }
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new Rec();
  r.lang = "en-ZA";
  r.onresult = function(e){ document.getElementById('userInput').value = e.results[0][0].transcript; sendMsg(); };
  r.start();
  addMsg("ai", "🎤 Listening... speak now.");
}
async function sendMsg(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text && !pendingFile) return;
  const key = getKey();
  if(!key){
    addMsg("ai", "⚠️ Paste your key in the white box at the TOP, tap Save Key, then ask again.");
    return;
  }
  addMsg("me", text || "Please read this file.");
  input.value = "";
  const thinking = addMsg("ai", "Thinking...");
  try{
    let parts = [{text: text || "Please explain this file."}];
    if(pendingFile && pendingFileType.startsWith("image/")){
      parts.push({inline_data:{mime_type:pendingFileType, data:pendingFile.split(",")[1]}});
    }
    pendingFile = null;
    const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + key;
    const res = await fetch(url, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({contents:[{parts:parts}]})
    });
    const data = await res.json();
    if(data.error){
      thinking.textContent = "Gemini error: " + data.error.message + " - wait 1 min and try again.";
      return;
    }
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No reply, try again.";
    thinking.textContent = reply;
  }catch(e){
    thinking.textContent = "Error: " + e.message + " - check internet and try again.";
  }
}
</script>
</body>
</html>
