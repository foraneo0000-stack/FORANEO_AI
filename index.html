<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORANEO_AI</title>
<style>
body{background:#000;color:#fff;font-family:Arial,sans-serif;margin:0;padding:10px}
#chat{max-width:700px;margin:0 auto;padding-bottom:110px}
.msg{background:#1e1e1e;padding:12px 14px;border-radius:15px;margin:10px 0;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.user{background:#00d8a0;color:#000;text-align:right;margin-left:60px}
.msg img,.msg video{width:100%;border-radius:12px;margin-top:10px;display:block}
.title{text-align:center;color:#00d8a0;font-weight:bold;font-size:22px}
.sub{text-align:center;color:#aaa;font-size:13px;margin-bottom:10px}
#box{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:6px;max-width:700px;margin:0 auto}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff}
button{padding:10px 12px;border-radius:20px;border:none;background:#00d8a0;font-weight:bold;font-size:12px}
.top{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.top button{background:#222;color:#fff;border:1px solid #333}
</style>
</head>
<body>
<div id="chat">
<div class="title">FORANEO_AI</div>
<div class="sub">Made by FORANEO (PTY) LTD - Under Foraneo Net - Owner: KARABO Langa</div>
<div class="top">
<button onclick="freezeApp()">❄️ Freeze App</button>
<button onclick="unfreezeApp()">🔥 Unfreeze</button>
<button onclick="showUsers()">👥 Users</button>
<button onclick="showLog()">📊 Track</button>
<button onclick="showStudio()">🎛️ Studio</button>
<button onclick="showTools()">🎨 Logo / Photo</button>
</div>
<div class="msg">Welcome to FORANEO_AI. Made by FORANEO (PTY) LTD, under Foraneo Net. Owner: KARABO Langa. Hours: Mon-Sun 3:00 PM to 5:40 PM. Address: 50226 Masodi, Mokopane, 0600. Try: Generate a garden image / Generate video</div>
</div>
<div id="box"><input id="q" placeholder="Ask FORANEO_AI anything..."><button onclick="ask()">Send</button></div>
<script>
let frozen=false;
let users=JSON.parse(localStorage.getItem('foraneo_users')||'["You"]');
let activity=JSON.parse(localStorage.getItem('foraneo_log')||'[]');
const chat=document.getElementById('chat'); const input=document.getElementById('q');
const FORANEO_FULL="FORANEO (PTY) LTD - Foraneo Net.\nOwner: KARABO Langa.\nAddress: 50226 Masodi, Mokopane, 0600.\nHours: Monday to Sunday, 3:00 PM to 5:40 PM.\nMade by FORANEO (PTY) LTD, under Foraneo Net department.";
function log(a){activity.push(new Date().toLocaleTimeString()+" - "+a);localStorage.setItem('foraneo_log',JSON.stringify(activity));}
function add(t,cls){const d=document.createElement('div');d.className='msg '+(cls||'');d.innerText=t;chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d;}
function freezeApp(){frozen=true;add("❄️ FROZEN. Tap Unfreeze.",'');}
function unfreezeApp(){frozen=false;add("🔥 UNFROZEN.",'');}
function showUsers(){add("👥 Users:\n"+users.join("\n"),'');}
function showLog(){add("📊 Activity:\n"+activity.slice(-20).join("\n"),'');}
function showStudio(){const d=document.createElement('div');d.className='msg';d.innerHTML=`<b>🎛️ STUDIO</b><br><button onclick="playDrill()">▶️ Play Drill Beat</button> <button onclick="stopBeat()">⏹️ Stop</button>`;chat.appendChild(d);}
function showTools(){const d=document.createElement('div');d.className='msg';d.innerHTML=`<b>🎨 LOGO</b><br><button onclick="makeLogo()">Create Logo FORANEO</button><br><br><input type="file" accept="image/*" onchange="editPhoto(event)">`;chat.appendChild(d);}
function makeLogo(){const c=document.createElement('canvas');c.width=600;c.height=300;const x=c.getContext('2d');x.fillStyle='#00d8a0';x.fillRect(0,0,600,300);x.fillStyle='#000';x.font='bold 60px Arial';x.fillText('FORANEO',150,130);x.font='20px Arial';x.fillText('Owner: KARABO Langa',170,180);const d=document.createElement('div');d.className='msg';d.innerText="Logo - Made by FORANEO_AI";d.appendChild(c);chat.appendChild(d);}
function editPhoto(e){const u=URL.createObjectURL(e.target.files[0]);const d=document.createElement('div');d.className='msg';d.innerHTML=`<img src="${u}">`;chat.appendChild(d);}
let ac=null,bt=null;
function playDrill(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();let s=0;stopBeat();bt=setInterval(()=>{const t=ac.currentTime;if(s%8===0){const o=ac.createOscillator();const g=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.2);g.gain.setValueAtTime(0.8,t);g.gain.exponentialRampToValueAtTime(0.01,t+0.3);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.3);}s++;},60000/140/2);add("🥁 Drill Beat Playing - 140 BPM",'');}
function stopBeat(){if(bt)clearInterval(bt);}
// --- VIDEO MAKER - THIS WAS MISSING BEFORE ---
function makeVideo(prompt){
  const d=document.createElement('div');d.className='msg';d.innerText="Here is your video: "+prompt+" - Made by FORANEO_AI - Owner: KARABO Langa";
  const c=document.createElement('canvas');c.width=512;c.height=300;d.appendChild(c);
  const vid=document.createElement('video');vid.controls=true;vid.autoplay=true;vid.muted=true;vid.playsInline=true;d.appendChild(vid);chat.appendChild(d);
  const ctx=c.getContext('2d');const stream=c.captureStream(30);const rec=new MediaRecorder(stream,{mimeType:'video/webm'});const chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{vid.src=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));};
  rec.start();let f=0;const iv=setInterval(()=>{ctx.fillStyle='#00d8a0';ctx.fillRect(0,0,512,300);ctx.fillStyle='#000';ctx.font='bold 28px Arial';ctx.fillText(prompt,20,140);ctx.fillText("FORANEO_AI - "+f,20,190);f++;if(f>90){clearInterval(iv);rec.stop();}},33);
}
async function ask(){
if(frozen){alert("FROZEN - Tap Unfreeze");return;}
const v=input.value.trim();if(!v)return;add(v,'user');log("Asked: "+v);input.value='';const q=v.toLowerCase();
// --- VIDEO FIRST - FIXED ---
if(q.includes('video')){
  let p=v.replace(/generate|create|make|a video|video|please/gi,'').trim();
  if(!p) p="beautiful nature";
  makeVideo(p); return;
}
// --- IMAGE ---
if(q.includes('generate') || q.includes('draw') || q.includes('create image') || q.includes('make image')){
  if(q.includes('logo')){makeLogo();return;}
  if(q.includes('image') || q.includes('picture') || q.includes('photo') || q.includes('garden') || q.includes('math') || q.includes('test')){
    let p=v.replace(/generate|draw|create|make|an image|a image|image|picture|photo|please/gi,'').trim()||"garden";
    const d=document.createElement('div');d.className='msg';d.innerText="Here is your image: "+p+" - Made by FORANEO_AI";
    const img=document.createElement('img');img.src="https://image.pollinations.ai/prompt/"+encodeURIComponent(p+" image")+"?width=512&height=512&seed="+Math.floor(Math.random()*99999);d.appendChild(img);chat.appendChild(d);log("Image: "+p);return;
  }
}
if(q.startsWith('add user')){const n=v.slice(8).trim();users.push(n);localStorage.setItem('foraneo_users',JSON.stringify(users));add("✅ Added: "+n,'');return;}
if(q.startsWith('remove user')){const n=v.slice(11).trim();users=users.filter(u=>u.toLowerCase()!==n.toLowerCase());localStorage.setItem('foraneo_users',JSON.stringify(users));add("🗑️ Removed: "+n,'');return;}
if(q.includes('freeze')){freezeApp();return;}
if(q.includes('unfreeze')){unfreezeApp();return;}
if(q.includes('owner')||q.includes('karabo')){add("Owner of FORANEO (PTY) LTD is KARABO Langa.\n\n"+FORANEO_FULL,'');return;}
if(q.includes('who made')){add("Made by FORANEO (PTY) LTD, under Foraneo Net. Owner: KARABO Langa.",'');return;}
if(q.includes('hours')||q.includes('working')||q.includes('open')){add("FORANEO (PTY) LTD is open Monday to Sunday, 3:00 PM to 5:40 PM.\nAddress: 50226 Masodi, Mokopane, 0600\nOwner: KARABO Langa",'');return;}
if(q.includes('foraneo')){add(FORANEO_FULL,'');return;}
if(q.includes('beat')||q.includes('drill')){playDrill();return;}
const thinking=add("Thinking... Made by FORANEO_AI",'');
try{const sys="You are FORANEO_AI, made by FORANEO (PTY) LTD, under Foraneo Net. Owner KARABO Langa. Hours Mon-Sun 3:00 PM to 5:40 PM. NEVER guess. If you don't know say I don't know.";const r=await fetch("https://text.pollinations.ai/"+encodeURIComponent(sys+"\nUser: "+v+"\nFORANEO_AI:"));const t=await r.text();thinking.innerText=t.trim()||"I don't know.";}catch(e){thinking.innerText="I don't know. No internet.";}
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
</script>
</body>
</html>
