<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORANEO_AI</title>
<style>body{font-family:Arial;background:#eef2ff;margin:0;padding:15px}h1{text-align:center}input,button{padding:12px;border-radius:10px;border:1px solid #ccc}input{width:70%}button{background:#2563eb;color:#fff;border:none}#chat{background:#fff;border-radius:15px;padding:15px;min-height:300px;white-space:pre-wrap}.user{background:#2563eb;color:#fff;padding:10px;border-radius:10px;margin:10px 0;text-align:right}</style>
</head><body>
<h1>🤖 FORANEO_AI</h1>
<input id="key" placeholder="Paste Gemini API Key here">
<button onclick="saveKey()">Save Key</button>
<div id="chat">Hi! I'm FORANEO_AI. Ask me anything...</div><br>
<input id="q" placeholder="Ask FORANEO_AI anything...">
<button onclick="ask()">Send</button>
<script>
function saveKey(){localStorage.setItem('gemini_key',document.getElementById('key').value);alert('Key saved!');}
document.getElementById('key').value=localStorage.getItem('gemini_key')||'';
async function ask(){
let q=document.getElementById('q').value; if(!q) return;
let key=localStorage.getItem('gemini_key'); if(!key){alert('Paste your API Key first');return;}
let chat=document.getElementById('chat'); chat.innerHTML+=`<div class="user">${q}</div><div>Thinking...</div>`; document.getElementById('q').value='';
let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:q}]}]})});
let data=await res.json();
let ans=data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error: '+JSON.stringify(data).slice(0,300);
chat.innerHTML=chat.innerHTML.replace('Thinking...',ans); chat.scrollTop=chat.scrollHeight;
}
</script></body></html>
